plugins {
    id 'fabric-loom' version '1.10.5'
    id 'maven-publish'
    id 'idea'
    id 'eclipse'
}

def modGroupId = property('mod_group_id').toString()
def modVersion = property('mod_version').toString()
def modId = property('mod_id').toString()
def minecraftVersion = property('minecraft_version').toString()
def fabricLoaderVersion = property('fabric_loader_version').toString()
def fabricApiVersion = property('fabric_api_version').toString()

group = modGroupId
version = "${modVersion}-mc${minecraftVersion}-fabric"

base {
    archivesName = 'epic-fight'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

loom {
    accessWidenerPath = file('src/main/resources/epicfight.accesswidener')
    mixin {
        defaultRefmapName = "mixins.${modId}.refmap.json"
    }
}

sourceSets {
    main {
        java.srcDirs = ['src/main/java']
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'
sourceSets.main.java.exclude(
    'yesman/epicfight/compat/VampirismCompat.java',
    'yesman/epicfight/compat/WerewolvesCompat.java',
    'yesman/epicfight/compat/CuriosCompat.java',
    'yesman/epicfight/compat/IceAndFireCompat.java',
    'yesman/epicfight/compat/PlayerReviveCompat.java',
    'yesman/epicfight/compat/fgm/**',
    'yesman/epicfight/compat/kubejs/**',
    'yesman/epicfight/mixin/teamlapen/**'
)

repositories {
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        name = 'Architectury'
        url = 'https://maven.architectury.dev'
    }
    maven {
        name = 'Latvian'
        url = 'https://maven.latvian.dev/releases'
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com/'
    }
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/releases/'
    }
    maven {
        name = 'Ladysnake'
        url = 'https://maven.ladysnake.org/releases'
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
    flatDir {
        dir 'libs'
    }
    mavenCentral()
}

def packModsDir = file('D:/MC/1.21.1/pack-build/jars')
def packMod = { String name -> new File(packModsDir, name) }

def addPackMod = { String configurationName, String name ->
    def modFile = packMod(name)
    if (modFile.isFile()) {
        dependencies.add(configurationName, files(modFile))
    }
}

def packCompileMods = [
    'architectury-13.0.11-fabric.jar',
    'azurelib-fabric-1.21.1-3.1.11.jar',
    'azurelibarmor-fabric-1.21.1-3.1.3.jar',
    'geckolib-fabric-1.21.1-4.9.3.jar',
    'iris-fabric-1.8.14-beta.1+mc1.21.1.jar',
    'player-animation-lib-fabric-2.0.4+1.21.1.jar',
    'sodium-fabric-0.8.13+mc1.21.1.jar',
    'trinkets-4.2.1.jar',
    'accessories-fabric-1.1.0-beta.53+1.21.1.jar',
    'jei-1.21.1-fabric-19.56.0.441.jar',
    'Pehkui-3.8.3+1.14.4-1.21.jar',
    'Origins-1.13.0-pre.3+mc.1.21.1.jar',
    'yet_another_config_lib_v3-3.8.2+1.21.1-fabric.jar',
    'controlify-3.0.1+lts+1.21.1-fabric.jar',
    'firstperson-fabric-2.7.2-mc1.21.1.jar',
    'CreativeCore_FABRIC_v2.13.39_mc1.21.1.jar',
    'ForgeConfigAPIPort-v21.1.6-1.21.1-Fabric.jar'
]

def includePrivatePackRuntime = providers.gradleProperty('includePrivatePackRuntime')
    .map { it.toBoolean() }
    .orElse(false)
    .get()

dependencies {
    minecraft "com.mojang:minecraft:${minecraftVersion}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${fabricLoaderVersion}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"

    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'

    // 3D Skin Layers
    modCompileOnly 'maven.modrinth:3dskinlayers:1.10.1'

    // Better Combat
    modCompileOnly files('pack-build/jars/bettercombat-fabric-2.4.0+1.21.1.jar')

    // Controlify
    modCompileOnly files('pack-build/jars/controlify-3.0.1+lts+1.21.1-fabric.jar')

    // First Person Model
    modCompileOnly files('pack-build/jars/firstperson-fabric-2.7.2-mc1.21.1.jar')

    // TRender / TRansition (local libs)
    implementation files('libs/TRender-1.0.7.jar')
    implementation files('libs/TRansition-1.0.5.jar')

    // ForgeConfigAPIPort (for config compat)
    modCompileOnly files('pack-build/jars/ForgeConfigAPIPort-v21.1.6-1.21.1-Fabric.jar')

    // Player Animator (for Geckolib compat)
    modCompileOnly 'dev.kosmx.player-anim:player-animation-lib-forge:2.0.4+1.21.1'

    // Geckolib
    modCompileOnly 'software.bernie.geckolib:geckolib-fabric-1.21.1:4.9.3'

    // AzureLib
    modCompileOnly 'mod.azure.azurelib:azurelib-fabric-1.21.1:3.1.11'
    modCompileOnly 'mod.azure.azurelibarmor:azurelibarmor-fabric-1.21.1:3.1.3'

    // SimplySwords (Kotlin)
    modCompileOnly 'maven.modrinth:simply-swords:1.63.0-1.21.1'
    modCompileOnly 'org.jetbrains.kotlin:kotlin-stdlib:2.4.20'

    // PlayerRevive
    modCompileOnly 'maven.modrinth:playerrevive:2.1.0'

    // CreativeCore
    modCompileOnly 'maven.modrinth:creativecore:2.13.35'
}

packCompileMods.each { name ->
    addPackMod('modCompileOnly', name)
    if (includePrivatePackRuntime) {
        addPackMod('modLocalRuntime', name)
    }
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
        minecraft_version: minecraftVersion,
        fabric_loader_version: fabricLoaderVersion,
        fabric_api_version: fabricApiVersion,
        mod_id: modId,
        mod_name: project.property('mod_name').toString(),
        mod_license: project.property('mod_license').toString(),
        mod_version: modVersion,
        mod_authors: project.property('mod_authors').toString(),
        mod_description: project.property('mod_description').toString()
    ]

    inputs.properties replaceProperties

    exclude 'META-INF/mods.toml'

    filesMatching(['fabric.mod.json', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes 'MixinConfigs': "mixins.${modId}.json"
    }

    from rootProject.file('LICENSE')
    from rootProject.file('LICENSE-ASSETS')
    from(rootProject.file('LICENSE-ASSETS')) {
        into "assets/${modId}"
    }
    from(rootProject.file('LICENSE-ASSETS')) {
        into 'assets/minecraft'
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = base.archivesName.get()
            from components.java
        }
    }
}

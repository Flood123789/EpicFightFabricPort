plugins {
    id 'fabric-loom' version '1.15.3'
    id 'maven-publish'
    id 'idea'
    id 'eclipse'
}

def modGroupId = property('mod_group_id').toString()
def modVersion = property('mod_version').toString()
def modId = property('mod_id').toString()
def minecraftVersion = property('minecraft_version').toString()
def fabricLoaderVersion = property('fabric_loader_version').toString()
def fabricApiVersion = property('fabric_api_version').toString()

group = modGroupId
version = "${modVersion}-mc${minecraftVersion}-fabric"

base {
    archivesName = 'epic-fight'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

loom {
    // accessWidenerPath = file('src/main/resources/epicfight.accesswidener')
    mixin {
        useLegacyMixinAp = true
    }
    }

sourceSets {
    main {
        java.srcDirs = ['src/main/java']
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'
sourceSets.main.java.exclude(
    'yesman/epicfight/compat/VampirismCompat.java',
    'yesman/epicfight/compat/WerewolvesCompat.java',
    'yesman/epicfight/compat/CuriosCompat.java',
    'yesman/epicfight/compat/IceAndFireCompat.java',
    'yesman/epicfight/compat/PlayerReviveCompat.java',
    'yesman/epicfight/compat/fgm/**',
    'yesman/epicfight/compat/kubejs/**',
    'yesman/epicfight/mixin/teamlapen/**'
)

repositories {
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        name = 'Architectury'
        url = 'https://maven.architectury.dev'
    }
    maven {
        name = 'Latvian'
        url = 'https://maven.latvian.dev/releases'
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com/'
    }
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/releases/'
    }
    maven {
        name = 'Ladysnake'
        url = 'https://maven.ladysnake.org/releases'
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
    flatDir {
        dir 'libs'
    }
    mavenCentral()
}

def packModsDir = file('D:/MC/1.21.1/pack-build/jars')
def packMod = { String name -> new File(packModsDir, name) }

def addPackMod = { String configurationName, String name ->
    def modFile = packMod(name)
    if (modFile.isFile()) {
        dependencies.add(configurationName, files(modFile))
    }
}

def packCompileMods = [
    'architectury-13.0.11-fabric.jar',
    'jei-1.21.1-fabric-19.56.0.441.jar',
    'Pehkui-3.8.3+1.14.4-1.21.jar',
    'Origins-1.13.0-pre.3+mc.1.21.1.jar',
    'yet_another_config_lib_v3-3.8.2+1.21.1-fabric.jar',
    'controlify-3.0.1+lts+1.21.1-fabric.jar',
    'firstperson-fabric-2.7.2-mc1.21.1.jar',
    'CreativeCore_FABRIC_v2.13.39_mc1.21.1.jar',
    'ForgeConfigAPIPort-v21.1.6-1.21.1-Fabric.jar'
]

def includePrivatePackRuntime = providers.gradleProperty('includePrivatePackRuntime')
    .map { it.toBoolean() }
    .orElse(false)
    .get()

dependencies {
    minecraft "com.mojang:minecraft:${minecraftVersion}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${fabricLoaderVersion}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"

    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'

    modCompileOnly files('pack-build/jars/bettercombat-fabric-2.4.0+1.21.1.jar')
    modCompileOnly files('pack-build/jars/player-animation-lib-fabric-2.0.4+1.21.1.jar')
    modCompileOnly files('pack-build/jars/geckolib-fabric-1.21.1-4.9.3.jar')
    modCompileOnly files('pack-build/jars/azurelib-fabric-1.21.1-3.1.11.jar')
    modCompileOnly files('pack-build/jars/azurelibarmor-fabric-1.21.1-3.1.3.jar')

    implementation files('libs/TRender-1.0.7.jar')
    implementation files('libs/TRansition-1.0.5.jar')
}

packCompileMods.each { name ->
    addPackMod('modCompileOnly', name)
    if (includePrivatePackRuntime) {
        addPackMod('modLocalRuntime', name)
    }
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
        minecraft_version: minecraftVersion,
        fabric_loader_version: fabricLoaderVersion,
        fabric_api_version: fabricApiVersion,
        mod_id: modId,
        mod_name: project.property('mod_name').toString(),
        mod_license: project.property('mod_license').toString(),
        mod_version: modVersion,
        mod_authors: project.property('mod_authors').toString(),
        mod_description: project.property('mod_description').toString()
    ]

    inputs.properties replaceProperties

    exclude 'META-INF/mods.toml'

    filesMatching(['fabric.mod.json', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes 'MixinConfigs': "mixins.${modId}.json"
    }

    from rootProject.file('LICENSE')
    from rootProject.file('LICENSE-ASSETS')
    from(rootProject.file('LICENSE-ASSETS')) {
        into "assets/${modId}"
    }
    from(rootProject.file('LICENSE-ASSETS')) {
        into 'assets/minecraft'
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = base.archivesName.get()
            from components.java
        }
    }
}

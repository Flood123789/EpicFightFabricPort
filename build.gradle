plugins {
    id 'fabric-loom' version '1.10.5'
    id 'maven-publish'
    id 'idea'
    id 'eclipse'
}

def modGroupId = property('mod_group_id').toString()
def modVersion = property('mod_version').toString()
def modId = property('mod_id').toString()
def minecraftVersion = property('minecraft_version').toString()
def fabricLoaderVersion = property('fabric_loader_version').toString()
def fabricApiVersion = property('fabric_api_version').toString()

group = modGroupId
version = "${modVersion}-mc${minecraftVersion}-fabric"

base {
    archivesName = 'epic-fight'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

loom {
    accessWidenerPath = file('src/main/resources/epicfight.accesswidener')
    mixin {
        defaultRefmapName = "mixins.${modId}.refmap.json"
    }
}

sourceSets {
    forgeApiStubs {
        java.srcDir 'src/compileOnlyStubs/java'
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'
sourceSets.main.java.exclude(
    'yesman/epicfight/compat/VampirismCompat.java',
    'yesman/epicfight/compat/WerewolvesCompat.java',
    'yesman/epicfight/compat/CuriosCompat.java',
    'yesman/epicfight/compat/IceAndFireCompat.java',
    'yesman/epicfight/compat/PlayerReviveCompat.java',
    'yesman/epicfight/compat/fgm/**',
    'yesman/epicfight/compat/kubejs/**',
    'yesman/epicfight/mixin/teamlapen/**'
)

repositories {
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        name = 'Architectury'
        url = 'https://maven.architectury.dev'
    }
    maven {
        name = 'Latvian'
        url = 'https://maven.latvian.dev/releases'
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com/'
    }
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/releases/'
    }
    maven {
        name = 'Ladysnake'
        url = 'https://maven.ladysnake.org/releases'
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'CurseMaven'
                url = 'https://cursemaven.com'
            }
        }
        filter {
            includeGroup 'curse.maven'
        }
    }
    flatDir {
        dir 'libs'
    }
    mavenCentral()
}

def privatePackModsDir = file('C:/Users/brand/AppData/Roaming/ModrinthApp/profiles/Worlds Lost (Beta)v2 1.0.0/mods')
def packMod = { String name -> new File(privatePackModsDir, name) }
def kiltNestedJarsDir = file('.gradle/kiltNestedJars')
def compatJarsDir = file('.gradle/compatJars')
def extractKiltNestedJars = tasks.register('extractKiltNestedJars', Copy) {
    onlyIf { packMod('Kilt-20.1.14.jar').isFile() }
    from(zipTree(packMod('Kilt-20.1.14.jar'))) {
        include 'META-INF/jars/*.jar'
        eachFile { details ->
            details.path = details.name
        }
        includeEmptyDirs = false
    }
    into kiltNestedJarsDir
}
def prepareCompatJars = tasks.register('prepareCompatJars') {
    outputs.dir compatJarsDir
    doLast {
        compatJarsDir.mkdirs()

        if (packMod('controlify-2.1.1+1.20.1-fabric.jar.disabled').isFile()) {
            copy {
                from packMod('controlify-2.1.1+1.20.1-fabric.jar.disabled')
                into compatJarsDir
                rename { 'controlify-2.1.1+1.20.1-fabric.jar' }
            }
        }

        if (packMod('firstperson-fabric-2.7.1-mc1.20.1.jar.disabled').isFile()) {
            copy {
                from packMod('firstperson-fabric-2.7.1-mc1.20.1.jar.disabled')
                into compatJarsDir
                rename { 'firstperson-fabric-2.7.1-mc1.20.1.jar' }
            }
        }
    }
}

if (packMod('Kilt-20.1.14.jar').isFile()) {
    copy {
        from(zipTree(packMod('Kilt-20.1.14.jar'))) {
            include 'META-INF/jars/*.jar'
            eachFile { details ->
                details.path = details.name
            }
            includeEmptyDirs = false
        }
        into kiltNestedJarsDir
    }
}
if (packMod('controlify-2.1.1+1.20.1-fabric.jar.disabled').isFile()) {
    copy {
        from packMod('controlify-2.1.1+1.20.1-fabric.jar.disabled')
        into compatJarsDir
        rename { 'controlify-2.1.1+1.20.1-fabric.jar' }
    }
}
if (packMod('firstperson-fabric-2.7.1-mc1.20.1.jar.disabled').isFile()) {
    copy {
        from packMod('firstperson-fabric-2.7.1-mc1.20.1.jar.disabled')
        into compatJarsDir
        rename { 'firstperson-fabric-2.7.1-mc1.20.1.jar' }
    }
}
def addPackMod = { String configurationName, String name ->
    def modFile = packMod(name)
    if (modFile.isFile()) {
        dependencies.add(configurationName, files(modFile))
    }
}
def packCompileMods = [
    'architectury-9.2.14-fabric.jar',
    'azurelib-fabric-1.20.1-2.0.41.jar',
    'azurelibarmor-fabric-1.20.1-2.0.14.jar',
    'geckolib-fabric-1.20.1-4.7.1.2.jar',
    'iris-1.7.6+mc1.20.1.jar',
    'player-animation-lib-fabric-1.0.2-rc1+1.20.jar',
    'ShoulderSurfing-Fabric-1.20.1-4.22.5.jar',
    'sodium-fabric-0.5.13+mc1.20.1.jar',
    'trinkets-3.7.2.jar',
    'accessories-fabric-1.0.0-beta.47+1.20.1.jar',
    'jei-1.20.1-fabric-15.20.0.106.jar',
    'Pehkui-3.8.3+1.14.4-1.21.jar',
    'Origins-1.20.1-1.10.0.jar',
    'yet_another_config_lib_v3-3.6.6+1.20.1-fabric.jar'
]
def includePrivatePackRuntime = providers.gradleProperty('includePrivatePackRuntime')
    .map { it.toBoolean() }
    .orElse(false)
    .get()

dependencies {
    minecraft "com.mojang:minecraft:${minecraftVersion}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${fabricLoaderVersion}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"
    forgeApiStubsCompileOnly files(new File(kiltNestedJarsDir, 'mergetool-api-1.0.jar'))
    compileOnly sourceSets.forgeApiStubs.output
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    compileOnly 'org.checkerframework:checker-qual:3.42.0'
    modCompileOnly 'maven.modrinth:3dskinlayers:1.9.2'
    modCompileOnly fileTree(dir: compatJarsDir, include: ['controlify-*.jar', 'firstperson-*.jar'])

    implementation files('libs/TRender-1.0.7.jar')
    implementation files('libs/TRansition-1.0.5.jar')

    // Private server compatibility baseline. These jars are already in the user's Modrinth profile.
    addPackMod('modCompileOnly', 'Kilt-20.1.14.jar')
    addPackMod('modLocalRuntime', 'Kilt-20.1.14.jar')
    addPackMod('modLocalRuntime', 'fabric-language-kotlin-1.13.11+kotlin.2.3.21.jar')
    modLocalRuntime files(new File(kiltNestedJarsDir, 'Fabric-ASM-v2.3.jar'))
    runtimeOnly fileTree(dir: kiltNestedJarsDir, include: ['*.jar'])
    addPackMod('modCompileOnly', 'ForgeConfigAPIPort-v8.0.2-1.20.1-Fabric.jar')
    addPackMod('modLocalRuntime', 'ForgeConfigAPIPort-v8.0.2-1.20.1-Fabric.jar')
    runtimeOnly 'org.jetbrains.kotlin:kotlin-stdlib:2.3.21'
    runtimeOnly 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.3.21'

    modCompileOnly fileTree(dir: kiltNestedJarsDir, include: [
        'accessors-*.jar',
        'asm-*.jar',
        'attributes-*.jar',
        'base-*.jar',
        'blocks-*.jar',
        'brewing-*.jar',
        'chunk_loading-*.jar',
        'client_events-*.jar',
        'common-*.jar',
        'core-*.jar',
        'data-*.jar',
        'entity-*.jar',
        'extensions-*.jar',
        'fluids-*.jar',
        'gametest-*.jar',
        'gui_utils-*.jar',
        'items-*.jar',
        'lazy_registration-*.jar',
        'level_events-*.jar',
        'loot-*.jar',
        'mixin_extensions-*.jar',
        'model_builders-*.jar',
        'model_generators-*.jar',
        'model_loader-*.jar',
        'model_materials-*.jar',
        'models-*.jar',
        'networking-*.jar',
        'obj_loader-*.jar',
        'recipe_book_categories-*.jar',
        'registries-*.jar',
        'tags-*.jar',
        'tool_actions-*.jar',
        'transfer-*.jar',
        'utility-*.jar'
    ])
    compileOnly fileTree(dir: kiltNestedJarsDir, include: [
        'eventbus-*.jar',
        'forgespi-*.jar',
        'mergetool-api-*.jar',
        'srgutils-*.jar',
        'unsafe-*.jar',
        'typetools-*.jar'
    ])
}

packCompileMods.each { name ->
    addPackMod('modCompileOnly', name)
    if (includePrivatePackRuntime) {
        addPackMod('modLocalRuntime', name)
    }
}
if (includePrivatePackRuntime) {
    addPackMod('modLocalRuntime', 'CreativeCore_FABRIC_v2.12.36_mc1.20.1.jar')
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
        minecraft_version: minecraftVersion,
        fabric_loader_version: fabricLoaderVersion,
        fabric_api_version: fabricApiVersion,
        mod_id: modId,
        mod_name: project.property('mod_name').toString(),
        mod_license: project.property('mod_license').toString(),
        mod_version: modVersion,
        mod_authors: project.property('mod_authors').toString(),
        mod_description: project.property('mod_description').toString()
    ]

    inputs.properties replaceProperties

    exclude 'META-INF/mods.toml'

    filesMatching(['fabric.mod.json', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

tasks.named('compileForgeApiStubsJava', JavaCompile).configure {
    dependsOn extractKiltNestedJars
}

tasks.named('compileJava', JavaCompile).configure {
    dependsOn tasks.named('compileForgeApiStubsJava'), extractKiltNestedJars, prepareCompatJars
    classpath = sourceSets.forgeApiStubs.output + classpath
}

tasks.matching { it.name == 'generateRemapClasspath' }.configureEach {
    dependsOn extractKiltNestedJars
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes 'MixinConfigs': "mixins.${modId}.json"
    }

    from rootProject.file('LICENSE')
    from rootProject.file('LICENSE-ASSETS')
    from(rootProject.file('LICENSE-ASSETS')) {
        into "assets/${modId}"
    }
    from(rootProject.file('LICENSE-ASSETS')) {
        into 'assets/minecraft'
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = base.archivesName.get()
            from components.java
        }
    }
}
